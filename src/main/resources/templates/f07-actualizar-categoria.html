    <!-- Contenedor que agrupa la navegación lateral y el contenido de esta función. -->

    <!-- Menú principal organizado por módulos. -->
    <aside class="sidebar">
        <h2>Clínica Dental</h2>
        <p class="menu-label">MENÚ PRINCIPAL</p>
        <a href="dashboard.html" th:href="@{/dashboard}">Inicio</a>
        <a href="f03-consultar-pacientes.html" th:href="@{/f03-consultar-pacientes.html}">Pacientes</a>
        <a class="active" aria-current="page" href="f06-consultar-categorias.html" th:href="@{/f06-consultar-categorias.html}">Categorías</a>
        <a href="f09-consultar-servicios.html" th:href="@{/f09-consultar-servicios.html}">Servicios</a>

        <!-- Área principal: aquí cambia el formulario, tabla o información de cada módulo. -->
        <main class="content">
            <!-- Encabezado que identifica la pantalla actual para el usuario. -->
            <header class="topbar">
                <h1>Actualizar categoría</h1>
                <p>Sistema web de agenda de citas odontológicas</p>
            </header>
            
<section class="form-container">
    <!-- F07: actualización del registro seleccionado. -->
    <!-- Formulario de esta operación. Los campos required evitan enviarlo incompleto. -->
    <form action="/f06-consultar-categorias.html" method="get">
        <div class="form-grid">
        <div class="form-group">
            <label for="id">ID</label>
            <input id="id" name="id" type="text" value="1" required>
        </div>
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" value="Preventiva" required>
        </div>
        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <input id="descripcion" name="descripcion" type="text" value="Servicios de prevención" required>
        </div>
        <div class="form-group">
            <label for="estado">Estado</label>
            <select id="estado" name="estado" required>
                <option value="Activa">Activa</option>
                <option value="Inactiva">Inactiva</option>
            </select>
        </div></div>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Guardar cambios</button>
            <button class="btn btn-secondary" type="reset">Restablecer</button>
        </div>
    </form>
</section>

        </main>
    </div>
</body>
