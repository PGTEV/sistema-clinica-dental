<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar cita | Clínica Dental</title>
    <!-- Hoja CSS: aplica el mismo diseño sencillo a todas las pantallas. -->
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
</head>
<!-- Vista interna del sistema: solo se muestra después del inicio de sesión. -->
<body>
    <!-- Contenedor que agrupa la navegación lateral y el contenido de esta función. -->
    <div class="app">
        
    <!-- Menú principal organizado por módulos. -->
    <aside class="sidebar">
        <h2>Clínica Dental</h2>
        <p class="menu-label">MENÚ PRINCIPAL</p>
        <a href="dashboard.html" th:href="@{/dashboard}">Inicio</a>
        <a href="f03-consultar-pacientes.html" th:href="@{/f03-consultar-pacientes.html}">Pacientes</a>
        <a href="f06-consultar-categorias.html" th:href="@{/f06-consultar-categorias.html}">Categorías</a>
        <a href="f09-consultar-servicios.html" th:href="@{/f09-consultar-servicios.html}">Servicios</a>
        <a href="f12-consultar-odontologos.html" th:href="@{/f12-consultar-odontologos.html}">Odontólogos</a>
        <a href="f15-consultar-consultorios.html" th:href="@{/f15-consultar-consultorios.html}">Consultorios</a>
        <a href="f17-disponibilidad.html" th:href="@{/f17-disponibilidad.html}">Horarios</a>
        <a class="active" aria-current="page" href="f18-agendar-cita.html" th:href="@{/f18-agendar-cita.html}">Citas</a>
        <a class="logout-link" href="index.html" th:href="@{/}">Cerrar sesión</a>
    </aside>
    
        <!-- Área principal: aquí cambia el formulario, tabla o información de cada módulo. -->
        <main class="content">
            <!-- Encabezado que identifica la pantalla actual para el usuario. -->
            <header class="topbar">
                <h1>Agendar cita odontológica</h1>
                <p>Sistema web de agenda de citas odontológicas</p>
            </header>

<p class="page-actions">
    <a class="btn" href="f19-cancelar-cita.html" th:href="@{/f19-cancelar-cita.html}">Cancelar cita</a>
    <a class="btn" href="f20-reprogramar-cita.html" th:href="@{/f20-reprogramar-cita.html}">Reprogramar cita</a>
</p>

<section class="form-container">
    <!-- F18: Agendar cita. -->
    <!-- Formulario de esta operación. Los campos required evitan enviarlo incompleto. -->
    <form action="#" method="get">
        <div class="form-grid">
            
        <div class="form-group">
            <label for="paciente">Paciente</label>
            <select id="paciente" name="paciente" required><option value="Juan Pérez">Juan Pérez</option><option value="María López">María López</option></select>
        </div>
        <div class="form-group">
            <label for="servicio">Servicio</label>
            <select id="servicio" name="servicio" required><option value="Limpieza dental">Limpieza dental</option><option value="Evaluación general">Evaluación general</option><option value="Curación">Curación</option></select>
        </div>
        <div class="form-group">
            <label for="odontologo">Odontólogo</label>
            <select id="odontologo" name="odontologo" required><option value="Dr. Carlos Pérez">Dr. Carlos Pérez</option><option value="Dra. Ana López">Dra. Ana López</option></select>
        </div>
        <div class="form-group">
            <label for="fecha">Fecha</label>
            <input id="fecha" name="fecha" type="date" required>
        </div>
        <div class="form-group">
            <label for="hora">Hora</label>
            <input id="hora" name="hora" type="time" required>
        </div>
        <div class="form-group">
            <label for="consultorio">Consultorio</label>
            <select id="consultorio" name="consultorio" required><option value="Consultorio 1">Consultorio 1</option><option value="Consultorio 2">Consultorio 2</option></select>
        </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <button class="btn btn-secondary" type="reset">Limpiar</button>
        </div>

        <div id="message" class="message"></div>
    </form>
</section>

        </main>
    </div>
</body>
</html>
