<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración técnica: codificación, adaptación a celulares, título y archivos compartidos. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reprogramar cita | Clínica Dental</title>
    <!-- Hoja CSS: aplica el mismo diseño sencillo a todas las pantallas. -->
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
</head>
<!-- Vista interna del sistema: solo se muestra después del inicio de sesión. -->
<body>
    <!-- Contenedor que agrupa la navegación lateral y el contenido de esta función. -->
    <div class="app">
        
    <!-- Menú principal organizado por módulos. -->
    <aside class="sidebar">
        <h2>Clínica Dental</h2>
        <p class="menu-label">MENÚ PRINCIPAL</p>
        <a href="dashboard.html" th:href="@{/dashboard}">Inicio</a>
        <a href="f03-consultar-pacientes.html" th:href="@{/f03-consultar-pacientes.html}">Pacientes</a>
        <a href="f06-consultar-categorias.html" th:href="@{/f06-consultar-categorias.html}">Categorías</a>
        <a href="f09-consultar-servicios.html" th:href="@{/f09-consultar-servicios.html}">Servicios</a>
        <a href="f12-consultar-odontologos.html" th:href="@{/f12-consultar-odontologos.html}">Odontólogos</a>
        <a href="f15-consultar-consultorios.html" th:href="@{/f15-consultar-consultorios.html}">Consultorios</a>
        <a href="f17-disponibilidad.html" th:href="@{/f17-disponibilidad.html}">Horarios</a>
        <a class="active" aria-current="page" href="f18-agendar-cita.html" th:href="@{/f18-agendar-cita.html}">Citas</a>
        <a class="logout-link" href="index.html" th:href="@{/}">Cerrar sesión</a>
    </aside>
    
        <!-- Área principal: aquí cambia el formulario, tabla o información de cada módulo. -->
        <main class="content">
            <!-- Encabezado que identifica la pantalla actual para el usuario. -->
            <header class="topbar">
                <h1>Reprogramar cita odontológica</h1>
                <p>Sistema web de agenda de citas odontológicas</p>
            </header>
            
<section class="form-container">
    <!-- F20: reprogramación. Se verifica una nueva fecha y horario
         antes de guardar el cambio en una implementación completa. -->
    <!-- Formulario de esta operación. Los campos required evitan enviarlo incompleto. -->
    <form action="#" method="get">
        <div class="form-grid">
            <div class="form-group">
                <label for="cita">Cita actual</label>
                <select id="cita" required>
                    <option>C001 - Juan Pérez - 10/09/2026 09:00</option>
                    <option>C002 - María López - 10/09/2026 10:00</option>
                </select>
            </div>
            <div class="form-group">
                <label for="fecha">Nueva fecha</label>
                <input id="fecha" type="date" required>
            </div>
            <div class="form-group">
                <label for="hora">Nueva hora</label>
                <input id="hora" type="time" required>
            </div>
            <div class="form-group">
                <label for="odontologo">Odontólogo</label>
                <select id="odontologo" required>
                    <option>Dr. Carlos Pérez</option>
                    <option>Dra. Ana López</option>
                </select>
            </div>
        </div>
        <div class="form-actions">
            <button class="btn btn-primary" type="submit">Reprogramar cita</button>
        </div>
        <div id="message" class="message"></div>
    </form>
</section>

        </main>
    </div>
</body>
</html>
